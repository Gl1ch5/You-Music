# Inside the HTTPS server block of the site.

# Web player (youmusic-web.service): the UI, catalog and audio. Longer prefix, so it wins over /youmusic/.
location = /youmusic/app {
    return 301 /youmusic/app/;
}
location ^~ /youmusic/app/ {
    proxy_pass http://127.0.0.1:8741/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    client_max_body_size 30m;
    proxy_read_timeout 120s;
}

# Account server (youmusic-server.service): API, site, track pages.
location ^~ /youmusic/ {
    proxy_pass http://127.0.0.1:8740;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 30m;
    proxy_read_timeout 120s;
}
