name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI — install
        working-directory: web
        run: npm ci

      - name: Web UI — lint
        working-directory: web
        run: npm run lint

      - name: Web UI — typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web UI — tests
        working-directory: web
        run: npm test

      - name: Web UI — build into Android assets
        working-directory: web
        run: npx vite build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Android — debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v5
        with:
          name: you-music-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      # Without signing secrets, nightly builds use a keystore generated once and kept in the Actions cache,
      # so OTA updates install over each other. Set the KEYSTORE_* secrets for a permanent key.
      # The key is saved right after it is generated (not in a post step): a cancelled run must not lose it,
      # otherwise the next build gets a new key and updates stop installing.
      - name: Nightly keystore — restore
        id: keystore
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/restore@v4
        with:
          path: ~/.nightly-keystore
          key: nightly-keystore-v1

      - name: Nightly keystore — generate once
        id: keygen
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.keystore.outputs.cache-hit != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "save=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.nightly-keystore
          keytool -genkeypair -keystore ~/.nightly-keystore/nightly.jks -storepass nightly -keypass nightly \
            -alias nightly -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=You Music Nightly"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Nightly keystore — save now
        if: steps.keygen.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.nightly-keystore
          key: nightly-keystore-v1

      # Every push to the default branch refreshes the "nightly" pre-release, so there is always an APK to install.
      - name: Android — nightly release APK
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks" KEYSTORE_PASSWORD="$SECRET_KEYSTORE_PASSWORD" KEY_ALIAS="$SECRET_KEY_ALIAS" KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          else
            if [ ! -f ~/.nightly-keystore/nightly.jks ]; then echo "Nightly keystore is missing"; exit 1; fi
            export KEYSTORE_FILE=~/.nightly-keystore/nightly.jks KEYSTORE_PASSWORD=nightly KEY_ALIAS=nightly KEY_PASSWORD=nightly
          fi
          # Minutes since epoch: grows with every build across workflows, so OTA can compare versions.
          VERSION_CODE=$(( $(date +%s) / 60 ))
          VERSION_NAME="1.0.${{ github.run_number }}-nightly"
          ./gradlew :app:assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/you-music-nightly.apk
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg sha "$GITHUB_SHA" \
            --arg notes "$(git log -1 --pretty=%B | head -c 2000)" \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/nightly/you-music-nightly.apk" \
            '{versionCode: $code, versionName: $name, channel: "nightly", apk: $apk, notes: $notes, sha: $sha, publishedAt: (now | todate)}' > ../dist/version.json

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd examples/mods && for d in */; do (cd "$d" && zip -qr "../../../dist/mod-${d%/}.zip" .); done)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_SHA::7}" \
            --notes "Сборка из последнего коммита ветки ${GITHUB_REF_NAME}. Установите you-music-nightly.apk — дальше приложение обновляется само. Примеры модов — zip-файлы рядом."

  # You Music for Windows and Linux (pywebview + the same web UI). Runs after the APK so the nightly release
  # already exists; on the default branch the builds are attached to it.
  desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: YouMusic-windows.exe
          - os: ubuntu-22.04
            asset: YouMusic-linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI for the desktop
        working-directory: web
        run: |
          npm ci
          npm run build:web

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Python dependencies
        run: python -m pip install -r desktop/requirements-desktop.txt pyinstaller

      - name: Package
        working-directory: desktop
        run: |
          DENO=$(python -c "import deno; print(deno.find_deno_bin())")
          ARGS=(--noconfirm --windowed --name YouMusic --icon youmusic/assets/icon.ico
            --add-data "../web/dist-web:ui" --add-data "youmusic/assets:youmusic/assets"
            --add-binary "$DENO:bin" --collect-all yt_dlp_ejs)
          if [ "$RUNNER_OS" = Windows ]; then
            pyinstaller --onefile "${ARGS[@]}" run.py
            mkdir -p ../dist && cp dist/YouMusic.exe "../dist/${{ matrix.asset }}"
          else
            pyinstaller "${ARGS[@]}" run.py
            mkdir -p ../dist && tar -czf "../dist/${{ matrix.asset }}" -C dist YouMusic
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to nightly
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly "dist/${{ matrix.asset }}" --clobber
